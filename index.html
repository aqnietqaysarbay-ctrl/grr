<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: rgb(0, 0, 37);
        color: white;
      }
      input {
        padding: 20px;

        background-color: rgb(52, 52, 84);
        border: none;
        border-radius: 20px;
        display: flex;
        justify-content: start;
        align-items: start;
      }
      :placeholder-shown {
        color: white;
        display: flex;
        justify-content: start;
        align-items: start;
      }
      ::placeholder {
        color: white;
        display: flex;
        justify-content: start;
        align-items: start;
      }
    </style>
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      gap: 10px;
    "
  >
    <div class="op">
      <h1>Analyze your text in real-time.</h1>
    </div>
    <p id="count">COUNT</p>
    <textarea
      style="
        padding: 20px;
        width: 850px;
        background-color: rgb(52, 52, 84);
        border: none;
        border-radius: 10px;
        display: flex;
        justify-content: start;
        align-items: start;
      "
      id="write"
      type="text"
      placeholder="Start typing here... (or paste your text)"
    >
    </textarea>
    <div
      style="display: flex; flex-direction: row; gap: 10px; width: 900px"
      class=""
    >
      <div
        style="
          background-color: rgb(180, 101, 254);
          width: 300px;
          border-radius: 10px;
          padding: 10px;
          color: black;
          font-family: sans-serif;
        "
        class=""
      >
        <h1 style="font-size: 70px" id="letter">00</h1>
        <p style="font-size: 25px">Total Characters</p>
      </div>
      <div
        style="
          background-color: rgb(255, 199, 103);
          width: 300px;
          border-radius: 10px;
          padding: 10px;
          color: black;
          font-family: sans-serif;
        "
        class=""
      >
        <h1 style="font-size: 70px" id="word">00</h1>
        <p style="font-size: 25px">Word Count</p>
      </div>
      <div
        style="
          background-color: rgb(251, 151, 96);
          width: 300px;
          border-radius: 10px;
          padding: 10px;
          color: black;
          font-family: sans-serif;
        "
        class=""
      >
        <h1 style="font-size: 70px" id="sentence">00</h1>
        <p style="font-size: 25px">Sentence Count</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
